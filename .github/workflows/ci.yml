name: CI Pipeline

on:
  push:
    branches: [ main, ci-test-failure, '*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip > pip_log.txt 2>&1 || true
        pip install -e . >> pip_log.txt 2>&1 || true
        pip install pytest pytest-asyncio >> pip_log.txt 2>&1 || true
        git config user.name "CI Bot"
        git config user.email "bot@github.com"
        git add -f pip_log.txt
        git commit -m "Add pip log" || true
        git push || true
        cat pip_log.txt

    - name: Run Phase 7 Tests and Evaluation
      working-directory: ./backend
      env:
        GEMINI_API_KEY: "test_key"
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        QDRANT_URL: "http://localhost:6333"
        SECRET_KEY: "test_secret"
        UPLOAD_DIR: "./uploads"
        CLERK_SECRET_KEY: "test_key"
      run: |
        pytest -v test_prompt_7_3_chat_and_agent.py test_prompt_7_3_chat_and_agent_real.py > ci_pytest_log.txt 2>&1 || true
        python verify_retrieval_grounding_test_suite.py >> ci_pytest_log.txt 2>&1 || true
        git config user.name "CI Bot"
        git config user.email "bot@github.com"
        git add ci_pytest_log.txt
        git commit -m "Add CI log" || true
        git push || true
        cat ci_pytest_log.txt
