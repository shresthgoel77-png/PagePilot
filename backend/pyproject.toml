[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-backend"
version = "0.1.0"
description = "ResearchOS FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "qdrant-client>=1.6.0",
    "langchain>=0.0.300",
    "langgraph>=0.0.28",
    "httpx>=0.25.0",
    "pymupdf>=1.23.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.4.2",
    "google-genai>=0.5.0"
]
